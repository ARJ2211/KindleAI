services:
  # --INDIVIDUAL RUN COMMAND: docker compose up qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kindleai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # --INDIVIDUAL RUN COMMAND: docker compose up redis
  redis:
    image: redis/redis-stack-server:latest
    container_name: kindleai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --INDIVIDUAL RUN COMMAND: docker compose up mongo
  mongo:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"

  ollama:
    image: ollama/ollama:latest
    container_name: kindleai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: waits for Ollama API, then pulls the chat model into ollama_data.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: kindleai-ollama-pull
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "apt update && apt install -y curl && until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done && ollama pull llama3.2:3b",
      ]
    restart: "no"

  # --INDIVIDUAL RUN COMMAND: docker compose up backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kindleai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_DB: KindleAI
      MONGO_URL: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      # In-compose Ollama service (see `ollama` + `ollama-pull`). For host Ollama instead, use http://host.docker.internal:11434.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  # --INDIVIDUAL RUN COMMAND: docker compose up frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kindleai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  qdrant_data:
  redis_data:
  ollama_data: